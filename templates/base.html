<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Compressed Text Analyser{% endblock %}</title>
  <style>
    :root {
      --ink: #1b2130;
      --ink-soft: #4a5468;
      --accent: #3d55a5;
      --accent-dark: #2f4384;
      --accent-tint: #eef1fa;
      --muted: #78819a;
      --line: #e2e6f0;
      --line-soft: #edf0f7;
      --surface: #ffffff;
      --canvas: #f5f6fa;
      --danger: #a63f43;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(27, 33, 48, .05), 0 6px 20px rgba(27, 33, 48, .05);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
           color: var(--ink); background: var(--canvas); margin: 0;
           line-height: 1.55; font-size: 15px; }

    /* Header: a single accent band, so the page starts with one clear
       title instead of a run-on line of mixed-colour text. */
    .site-header { background: var(--surface); border-bottom: 1px solid var(--line); }
    .site-header .bar { max-width: 1020px; margin: 0 auto; padding: 1rem 1.5rem;
                        display: flex; align-items: center; justify-content: space-between;
                        gap: 1.5rem; flex-wrap: wrap; }
    .brand { display: flex; align-items: baseline; gap: .6rem; text-decoration: none;
             color: var(--ink); }
    .brand h1 { font-size: 1.15rem; font-weight: 650; letter-spacing: -.01em; margin: 0; }
    .brand .tag { font-size: .75rem; font-weight: 600; letter-spacing: .06em;
                  text-transform: uppercase; color: var(--accent);
                  background: var(--accent-tint); border-radius: 999px;
                  padding: .15rem .55rem; }
    nav { display: flex; gap: .4rem; }
    nav a { color: var(--ink-soft); text-decoration: none; font-size: .9rem;
            font-weight: 550; padding: .35rem .7rem; border-radius: 7px; }
    nav a:hover { color: var(--accent); background: var(--accent-tint); }

    main { max-width: 1020px; margin: 0 auto; padding: 1.75rem 1.5rem 4rem; }

    h2 { font-size: 1.05rem; font-weight: 650; letter-spacing: -.01em;
         margin: 0 0 .35rem; }
    p { margin: .35rem 0 0; }

    /* Every block of the page sits on its own card. */
    .card { background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--radius); box-shadow: var(--shadow);
            padding: 1.4rem 1.5rem; margin-bottom: 1.25rem; }
    .card > h2:first-child { margin-top: 0; }

    .flash { background: var(--accent-tint); border: 1px solid #c6d0ee;
             border-left: 3px solid var(--accent); border-radius: var(--radius);
             color: var(--accent-dark); padding: .7rem 1rem; margin-bottom: 1.25rem;
             font-size: .92rem; }

    table { border-collapse: collapse; width: 100%; margin-top: .9rem; font-size: .9rem; }
    th, td { text-align: left; padding: .55rem .7rem; border-bottom: 1px solid var(--line-soft); }
    th { color: var(--muted); font-weight: 600; font-size: .78rem;
         letter-spacing: .04em; text-transform: uppercase;
         border-bottom: 1px solid var(--line); white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover td, table tr:hover td { background: #fafbfd; }
    td a { color: var(--accent); font-weight: 550; text-decoration: none; }
    td a:hover { text-decoration: underline; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

    label { display: block; margin: 0 0 .3rem; font-weight: 600; font-size: .85rem;
            color: var(--ink-soft); }
    input[type=number], textarea, select, input[type=file] { width: 100%;
        padding: .5rem .65rem; background: #fff;
        border: 1px solid var(--line); border-radius: 8px; font: inherit;
        font-size: .92rem; color: var(--ink); }
    input[type=number]:focus, textarea:focus, select:focus {
        outline: none; border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(61, 85, 165, .12); }
    input[type=file] { padding: .4rem .5rem; font-size: .85rem; }
    textarea { min-height: 7rem; }

    /* Radio choices read as pickable tiles rather than stray bullets. */
    .choice { display: inline-flex; align-items: center; gap: .5rem; font-weight: 500;
              color: var(--ink); margin: 0 .5rem .4rem 0; padding: .45rem .8rem;
              border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
    .choice:hover { border-color: var(--accent); background: var(--accent-tint); }
    .choice input { margin: 0; accent-color: var(--accent); }

    .row { display: flex; gap: 1.1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .row > div { flex: 1; min-width: 220px; }
    .row.actions { align-items: center; gap: .6rem; margin: 1.25rem 0 0; }

    button, a.button { background: var(--accent); color: #fff; border: 1px solid transparent;
             border-radius: 8px; padding: .5rem 1.1rem; font: inherit; font-size: .9rem;
             font-weight: 600; cursor: pointer; margin: 0; line-height: 1.4; }
    button:hover, a.button:hover { background: var(--accent-dark); }
    a.button { display: inline-block; text-decoration: none; }
    a.button.secondary { background: #fff; color: var(--ink-soft); border-color: var(--line); }
    a.button.secondary:hover { background: var(--accent-tint); color: var(--accent);
                               border-color: #c6d0ee; }
    button.danger { background: #fff; color: var(--danger); border-color: #e6ccce;
                    padding: .28rem .7rem; font-size: .82rem; }
    button.danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
    button.small { background: #fff; color: var(--ink-soft); border-color: var(--line);
                   padding: .28rem .7rem; font-size: .82rem; }
    button.small:hover { background: var(--accent-tint); color: var(--accent);
                         border-color: #c6d0ee; }

    .plot-head { display: flex; align-items: center; justify-content: space-between;
                 gap: 1rem; margin-top: 0; }
    .plot-head h2 { margin: 0; }
    .plot-head form { margin: 0; }

    .muted { color: var(--muted); font-size: .875rem; }
    .hint { color: var(--muted); font-size: .85rem; margin-top: .5rem; }
    /* Explanatory notes under a control group, set apart from the fields. */
    .note { color: var(--ink-soft); font-size: .85rem; background: #fafbfd;
            border-left: 2px solid var(--line); border-radius: 0 6px 6px 0;
            padding: .55rem .8rem; margin: 0 0 1rem; }
    .note strong { color: var(--ink); }

    pre.preview { background: #fafbfd; border: 1px solid var(--line); border-radius: 8px;
                  padding: .85rem 1rem; white-space: pre-wrap; font-size: .84rem;
                  line-height: 1.5; margin-top: .9rem; max-height: 24rem; overflow: auto; }
    img.plot { display: block; max-width: 100%; height: auto; border: 1px solid var(--line);
               border-radius: 8px; margin-top: .9rem; }
    code { background: var(--accent-tint); color: var(--accent-dark);
           padding: .08rem .35rem; border-radius: 5px; font-size: .85em;
           font-family: ui-monospace, "SF Mono", Menlo, monospace; }

    /* A long table kept to a fixed height, so the page below it stays
       reachable. The header row sticks so the columns stay named while
       scrolling. */
    .scroll-table { max-height: 22rem; overflow-y: auto; border: 1px solid var(--line);
                    border-radius: 8px; margin-top: .9rem; }
    .scroll-table table { margin-top: 0; }
    .scroll-table th { position: sticky; top: 0; background: #fff; z-index: 1;
                       box-shadow: inset 0 -1px 0 var(--line); }
    td.token { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .84rem;
               white-space: pre; }

    .empty { color: var(--muted); font-size: .9rem; text-align: center;
             border: 1px dashed var(--line); border-radius: 8px;
             padding: 1.5rem 1rem; margin-top: .9rem; }

    @media (max-width: 640px) {
      .site-header .bar { padding: .9rem 1rem; }
      main { padding: 1.25rem 1rem 3rem; }
      .card { padding: 1.1rem 1rem; }
      nav { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="{{ url_for('index') }}">
        <h1>Compressed Text Analyser</h1>
        <span class="tag">BPE</span>
      </a>
      <nav>
        <a href="{{ url_for('index') }}">Run</a>
        <a href="{{ url_for('analysis') }}">Cross-file analysis</a>
        <a href="{{ url_for('figures') }}">Saved figures</a>
      </nav>
    </div>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

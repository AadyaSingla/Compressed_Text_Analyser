<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Compressed Text Analyser{% endblock %}</title>
  <style>
    :root { --ink: #1c2233; --accent: #4058b0; --muted: #6b7280; --line: #e3e6ee; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", sans-serif; color: var(--ink);
           max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem; }
    h1 { font-size: 1.5rem; } h1 a { color: inherit; text-decoration: none; }
    h2 { font-size: 1.1rem; margin-top: 2rem; }
    .flash { background: #eef2ff; border: 1px solid var(--accent); border-radius: 6px;
             padding: .6rem .9rem; margin: 1rem 0; }
    table { border-collapse: collapse; width: 100%; margin-top: .75rem; font-size: .92rem; }
    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    label { display: block; margin: .8rem 0 .25rem; font-weight: 600; font-size: .9rem; }
    input[type=number], textarea, select { width: 100%; padding: .45rem .6rem;
        border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    textarea { min-height: 7rem; }
    .row { display: flex; gap: 1rem; } .row > div { flex: 1; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 6px;
             padding: .55rem 1.1rem; font: inherit; cursor: pointer; margin-top: 1rem; }
    button.danger { background: #b04040; margin-top: 0; padding: .3rem .7rem; font-size: .85rem; }
    .muted { color: var(--muted); }
    pre.preview { background: #f7f8fb; border: 1px solid var(--line); border-radius: 6px;
                  padding: .75rem; white-space: pre-wrap; font-size: .85rem; }
    code { background: #f0f1f5; padding: .05rem .3rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1><a href="{{ url_for('index') }}">Compressed Text Analyser</a> <span class="muted">· BPE experiments</span></h1>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
